<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "VeloSite AI" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Cormorant+Garamond:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3efe8;
            --bg-alt: #ece6db;
            --surface: rgba(255, 251, 245, 0.8);
            --surface-strong: rgba(255, 251, 245, 0.92);
            --ink: #171614;
            --muted: #645d52;
            --line: rgba(23, 22, 20, 0.12);
            --accent: #c46b35;
            --shadow: 0 24px 60px rgba(38, 29, 17, 0.12);
            --radius-sm: 14px;
            --radius-md: 22px;
            --radius-lg: 32px;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            color: var(--ink);
            font-family: "Manrope", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(220, 180, 114, 0.18), transparent 30%),
                radial-gradient(circle at right, rgba(232, 122, 87, 0.12), transparent 24%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button,
        input,
        textarea,
        select {
            font: inherit;
        }
        .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 22px 28px 18px;
        }
        .brand-lockup {
            display: grid;
            gap: 4px;
        }
        .brand {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .brand-note {
            font-size: 0.82rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }
        .nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            appearance: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--ink);
            padding: 11px 16px;
            cursor: pointer;
            transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(23, 22, 20, 0.2);
        }
        .btn-primary {
            background: var(--ink);
            color: #fff8ef;
            border-color: var(--ink);
        }
        .btn-disabled {
            opacity: 0.46;
            pointer-events: none;
        }
        .page-shell {
            padding: 0 28px 28px;
        }
        .site-footer {
            padding: 0 28px 22px;
            color: var(--muted);
            font-size: 0.88rem;
        }
        @media (max-width: 820px) {
            .site-nav,
            .page-shell,
            .site-footer {
                padding-left: 16px;
                padding-right: 16px;
            }
            .site-nav {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <nav class="site-nav">
            <a href="/" class="brand-lockup">
                <span class="brand">VeloSite AI</span>
                <span class="brand-note">Generator + Studio</span>
            </a>
            <div class="nav-actions">
                {% block nav_actions %}
                <button class="btn btn-disabled" type="button" title="Coming soon">Export</button>
                {% endblock %}
            </div>
        </nav>
        <main class="page-shell {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            Taste-driven routing, structured variants, and section-based rendering.
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
