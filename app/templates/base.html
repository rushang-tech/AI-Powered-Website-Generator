<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "VeloSite AI" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <nav class="site-nav">
            <a href="/" class="brand-lockup">
                <span class="brand">VeloSite AI</span>
                <span class="brand-note">Generator + Studio</span>
            </a>
            <div class="nav-actions">
                {% block nav_actions %}
                <button class="btn btn-disabled" type="button" title="Coming soon">Export</button>
                {% endblock %}
            </div>
        </nav>
        <main class="page-shell {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            Taste-driven routing, structured variants, and section-based rendering.
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
