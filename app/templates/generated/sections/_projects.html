<section class="preview-section" data-section="projects">
    <div class="section-pad">
        <p class="section-overline">Selected work</p>
        <div class="section-grid-3">
            {% for project in selected_variant.content.projects %}
            <article class="grid-card">
                <span class="section-overline" style="margin-bottom: 8px;">{{ project.meta }}</span>
                <h3>{{ project.title }}</h3>
                <p>{{ project.desc }}</p>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
