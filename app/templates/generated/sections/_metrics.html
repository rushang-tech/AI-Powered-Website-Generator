<section
    class="preview-section"
    data-section="metrics"
    data-node-id="section-metrics"
    data-node-type="section"
    data-section-name="metrics"
>
    <div class="section-pad">
        <p class="section-overline">Key signals</p>
        <div class="section-grid-3">
            <div class="stat-card">
                <strong data-node-id="metric-1-value" data-node-type="text" data-edit-path="stat_1_value" data-section="metrics">{{ selected_variant.content.stat_1_value }}</strong>
                <span data-node-id="metric-1-label" data-node-type="text" data-edit-path="stat_1_label" data-section="metrics">{{ selected_variant.content.stat_1_label }}</span>
            </div>
            <div class="stat-card">
                <strong data-node-id="metric-2-value" data-node-type="text" data-edit-path="stat_2_value" data-section="metrics">{{ selected_variant.content.stat_2_value }}</strong>
                <span data-node-id="metric-2-label" data-node-type="text" data-edit-path="stat_2_label" data-section="metrics">{{ selected_variant.content.stat_2_label }}</span>
            </div>
            <div class="stat-card">
                <strong data-node-id="metric-3-value" data-node-type="text" data-edit-path="stat_3_value" data-section="metrics">{{ selected_variant.content.stat_3_value }}</strong>
                <span data-node-id="metric-3-label" data-node-type="text" data-edit-path="stat_3_label" data-section="metrics">{{ selected_variant.content.stat_3_label }}</span>
            </div>
        </div>
    </div>
</section>
