{% extends "base.html" %}

{% block nav_actions %}
<a class="btn" href="{{ url_for('main.login') }}">Login</a>
{% endblock %}

{% block content %}
<section class="auth-shell">
    <article class="auth-card">
        <p class="eyebrow">First step</p>
        <h1>Create your local account.</h1>
        <p class="auth-copy">This app stores users, conversations, and current Studio state in a local SQLite database.</p>
        <form class="auth-form" method="post">
            <label class="field">
                <span>Display name</span>
                <input name="display_name" type="text" autocomplete="name">
            </label>
            <label class="field">
                <span>Email</span>
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <label class="field">
                <span>Password</span>
                <input name="password" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>
        <p class="auth-meta">Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
    </article>
</section>
{% endblock %}
